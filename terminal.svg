  </g>
  <text x="280" y="23" fill="#8B949E" class="ui-text">train.py — Nirmit-Angane (main)</text>
  <rect x="548" y="11" width="34" height="16" rx="3" fill="#21262D" stroke="#30363D" stroke-width="0.5" />
  <text x="553" y="23" fill="#8B949E" class="shortcut">Ctrl K</text>

  <g class="ui-text" fill="#8B949E">
    <text x="740" y="23">PyTorch 2.4 🔥</text>
  </g>

  <!-- Line Numbers Column -->
  <g fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" text-anchor="end">
    <text x="44" y="66">1</text>
    <text x="44" y="88">2</text>
    <text x="44" y="110">3</text>
    <text x="44" y="132">4</text>
    <text x="44" y="154">5</text>
    <text x="44" y="176">6</text>
    <text x="44" y="198">7</text>
    <text x="44" y="220">8</text>
    <text x="44" y="242">9</text>
    <text x="44" y="264">10</text>
    <text x="44" y="286">11</text>
    <text x="44" y="308">12</text>
  </g>
  <line x1="56" y1="50" x2="56" y2="318" stroke="#21262D" stroke-width="1" />

  <!-- Code Content -->
  <g class="code">
    <!-- Line 1 -->
    <text x="72" y="66"><tspan fill="#FF7B72">from </tspan><tspan fill="#F0F6FC">nirmit_ai </tspan><tspan fill="#FF7B72">import </tspan><tspan fill="#D2A8FF">DeveloperModel</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#D2A8FF">Trainer</tspan></text>

    <!-- Line 2 -->
    <text x="72" y="88"><tspan fill="#8B949E"># Initialize Machine Learning Engineering Pipeline</tspan></text>

    <!-- Line 3 -->
    <text x="72" y="110"><tspan fill="#79C0FF">developer</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#D2A8FF">DeveloperModel</tspan><tspan fill="#C9D1D9">(</tspan></text>

    <!-- Line 4 -->
    <text x="96" y="132"><tspan fill="#FFA657">name</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#A5D6FF">"Nirmit Angane"</tspan><tspan fill="#C9D1D9">,</tspan></text>

    <!-- Line 5 -->
    <text x="96" y="154"><tspan fill="#FFA657">education</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#A5D6FF">"Diploma in Artificial Intelligence &amp; ML 🎓"</tspan><tspan fill="#C9D1D9">,</tspan></text>

    <!-- Line 6 -->
    <text x="96" y="176"><tspan fill="#FFA657">core_skills</tspan><tspan fill="#C9D1D9"> = [</tspan><tspan fill="#A5D6FF">"Python 🐍"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"PyTorch 🔥"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"OpenCV 👁️"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"DSA ⚡"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"Java ☕"</tspan><tspan fill="#C9D1D9">],</tspan></text>

    <!-- Line 7 -->
    <text x="96" y="198"><tspan fill="#FFA657">passion</tspan><tspan fill="#C9D1D9"> = [</tspan><tspan fill="#A5D6FF">"Computer Vision"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"Deep Learning"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"Algorithms"</tspan><tspan fill="#C9D1D9">],</tspan></text>

    <!-- Line 8 -->
    <text x="96" y="220"><tspan fill="#FFA657">philosophy</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#A5D6FF">"Code. Learn. Repeat. ♻️"</tspan></text>

    <!-- Line 9 -->
    <text x="72" y="242"><tspan fill="#C9D1D9">)</tspan></text>

    <!-- Line 10 -->
    <text x="72" y="264"><tspan fill="#8B949E"># Training on real-world problems</tspan></text>

    <!-- Line 11 -->
    <text x="72" y="286"><tspan fill="#79C0FF">trainer</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#D2A8FF">Trainer</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#FFA657">model</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#79C0FF">developer</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#FFA657">optimizer</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#A5D6FF">"AdamW(lr=1e-3)"</tspan><tspan fill="#C9D1D9">)</tspan></text>

    <!-- Line 12 -->
    <text x="72" y="308"><tspan fill="#79C0FF">metrics</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#79C0FF">trainer</tspan><tspan fill="#C9D1D9">.</tspan><tspan fill="#D2A8FF">fit</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#FFA657">epochs</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#79C0FF">float</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#A5D6FF">"inf"</tspan><tspan fill="#C9D1D9">))</tspan></text>
  </g>

  <!-- Status Bar / Output Line -->
  <line x1="0" y1="332" x2="840" y2="332" stroke="#30363D" stroke-width="1" />
  <g class="code" font-size="12.5">
    <text x="24" y="358">
      <tspan fill="#3FB950" font-weight="bold">❯ </tspan>
      <tspan fill="#A5D6FF">Epoch [∞</tspan><tspan fill="#C9D1D9">/∞</tspan><tspan fill="#A5D6FF">] </tspan>
      <tspan fill="#F0F6FC">Loss: </tspan><tspan fill="#3FB950">0.001 </tspan>
      <tspan fill="#F0F6FC">| Accuracy: </tspan><tspan fill="#3FB950">99.9% </tspan>
      <tspan fill="#F0F6FC">| Status: </tspan><tspan fill="#3FB950" font-weight="bold">Ready for Hire 🚀 </tspan>
      <tspan fill="#58A6FF" class="cursor">█</tspan>
    </text>
  </g>
