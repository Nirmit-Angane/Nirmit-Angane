      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: cursor-blink 1s infinite;
    }
  </style>

  <rect width="840" height="385" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- Title Bar -->
  <path d="M0 12C0 5.37258 5.37258 0 12 0H828C834.627 0 840 5.37258 840 12V38H0V12Z" fill="#161B22" />
  <line x1="0" y1="38" x2="840" y2="38" stroke="#30363D" stroke-width="1" />

