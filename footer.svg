<svg
  xmlns="http://www.w3.org/2000/svg"
  width="896"
  height="288"
  viewBox="0 0 896 288"
  fill="none"
>
  <style>
    * {
      transform-origin: center;
      transform-box: fill-box;
    }

    .animate-ping {
      animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .animate-fade-in {
      animation: fade-in 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    .animate-fade-in-bottom {
      animation: fade-in-bottom 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    .animate-fade-in-right {
      animation: fade-in-right 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    .title {
      opacity: 0;
      animation-delay: 0.3s;
    }

    .description {
      opacity: 0;
      animation-delay: 0.5s;
    }

    .additional {
      opacity: 0;
      animation-delay: 0.7s;
    }

    .additional__indicator {
      opacity: 0;
      animation-delay: 1.1s;
    }

    @keyframes ping {
      75%,
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fade-in-bottom {
      from {
        opacity: 0;
        transform: translate3d(0, -16px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes fade-in-right {
      from {
        opacity: 0;
        transform: translate3d(-16px, 0, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .font-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .font-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }
  </style>

  <g clip-path="url(#clip_footer_card_light)">
    <rect width="896" height="288" fill="url(#bg_gradient_light_inv)" />

    <mask id="grid_mask_light_inv" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="896" height="288">
      <rect width="896" height="288" fill="url(#mask_gradient_light_inv)" />
    </mask>

    <g mask="url(#grid_mask_light_inv)">
      <path
        d="M32.5 0V288M64.5 0V288M96.5 0V288M128.5 0V288M160.5 0V288M192.5 0V288M224.5 0V288M256.5 0V288M288.5 0V288M320.5 0V288M352.5 0V288M384.5 0V288M416.5 0V288M448.5 0V288M480.5 0V288M512.5 0V288M544.5 0V288M576.5 0V288M608.5 0V288M640.5 0V288M672.5 0V288M704.5 0V288M736.5 0V288M768.5 0V288M800.5 0V288M832.5 0V288M864.5 0V288M0 31.5H896M0 63.5H896M0 95.5H896M0 127.5H896M0 159.5H896M0 191.5H896M0 223.5H896M0 255.5H896"
        stroke="#64748B"
        stroke-opacity="0.12"
        stroke-dasharray="5 5"
      />
    </g>

    <line x1="0" y1="0.5" x2="896" y2="0.5" stroke="#E2E8F0" stroke-opacity="0.8" stroke-dasharray="8 6" />

    <!-- Title -->
    <g class="animate-fade-in-bottom title">
      <text x="448" y="112" text-anchor="middle" class="font-title">
        <tspan fill="#0F172A">Thanks for </tspan>
        <tspan fill="#7C3AED">visiting!</tspan>
        <tspan fill="#0F172A"> &#128522;</tspan>
      </text>
    </g>

    <!-- Description -->
    <g class="animate-fade-in description">
      <text x="448" y="152" text-anchor="middle" class="font-desc" fill="#475569">
        Show some love by starring some of the repositories! &#11088;
      </text>
    </g>

    <!-- Pill Badge -->
    <g class="animate-fade-in-right additional">
      <rect x="306" y="190" width="284" height="30" rx="15" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      
      <g class="additional__indicator animate-fade-in">
        <circle cx="326" cy="205" r="5" fill="#F43F5E" fill-opacity="0.8" class="animate-ping" />
        <circle cx="326" cy="205" r="3" fill="#E11D48" />
      </g>

      <text x="339" y="209" class="font-badge" fill="#334155">
        MADE WITH &#10084;&#65039; BY NIRMIT ANGANE
      </text>
    </g>
  </g>

  <defs>
    <linearGradient id="bg_gradient_light_inv" x1="448" y1="0" x2="448" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0" />
      <stop offset="0.45" stop-color="#F1F5F9" stop-opacity="0.6" />
      <stop offset="1" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="mask_gradient_light_inv" x1="448" y1="0" x2="448" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>

    <clipPath id="clip_footer_card_light">
      <path d="M0 0 H896 V256 C896 273.673 881.673 288 864 288 H32 C14.3269 288 0 273.673 0 256 V0 Z" fill="white" />
    </clipPath>
  </defs>
</svg>