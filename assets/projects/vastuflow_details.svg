<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" fill="none">
  <defs>
    <linearGradient id="card_grad_vastuflow" x1="0" y1="0" x2="800" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#0B0F19" />
    </linearGradient>
    <clipPath id="card_clip_vastuflow">
      <rect width="800" height="280" rx="0" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <g clip-path="url(#card_clip_vastuflow)">
    <!-- Card Background -->
    <rect width="800" height="280" fill="url(#card_grad_vastuflow)" />
    <!-- Outer Border -->
    <rect x="0.5" y="0.5" width="799" height="279" stroke="#1E293B" fill="none" />
    <!-- Top divider line connecting to screenshot -->
    <line x1="0" y1="0.5" x2="800" y2="0.5" stroke="#334155" stroke-width="1" />

    <!-- Icon Box (Square with border, like reference image) -->
    <g transform="translate(32, 22)">
      <rect width="48" height="48" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="24" y="32" text-anchor="middle" font-size="24">🏛️</text>
    </g>

    <!-- Project Title -->
    <text x="96" y="44" class="font-sans" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      VASTUFLOW — ANCIENT GEOMETRY
    </text>

    <!-- Tech Stack (in accent color like reference image) -->
    <text x="96" y="64" class="font-mono" font-size="12" font-weight="600" fill="#34D399" letter-spacing="0.2">
      Next.js • TypeScript • Canvas Math • Groq AI • Tailwind CSS
    </text>

    <!-- Description Paragraph -->
    <g transform="translate(32, 105)">
      <text class="font-sans" font-size="14.5" fill="#94A3B8" font-weight="400">
        <tspan x="0" y="0">Deterministic floor-plan architectural analysis engine with 16-zone Shakti </tspan>
        <tspan x="0" y="24">Chakra ray-casting, 32 entrance deity mapping, and AI spatial remedies.</tspan>
      </text>
    </g>

    <!-- Category Pill Tags -->
    
        <g transform="translate(32, 190)">
          <rect width="130.5" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="65.25" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">ARCHITECTURE AI</text>
        </g>
        <g transform="translate(172.5, 190)">
          <rect width="168.0" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="84.0" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">GEOMETRIC ALGORITHMS</text>
        </g>
        <g transform="translate(350.5, 190)">
          <rect width="115.5" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="57.75" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">OFFLINE-FIRST</text>
        </g>

    <!-- Action Link: VIEW REPOSITORY ➔ -->
    <g transform="translate(32, 246)">
      <text class="font-sans" font-size="13" font-weight="700" fill="#34D399" letter-spacing="1">
        VIEW REPOSITORY &#10142;
      </text>
    </g>
  </g>
</svg>