<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" fill="none">
  <defs>
    <linearGradient id="card_grad_devflow" x1="0" y1="0" x2="800" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#0B0F19" />
    </linearGradient>
    <clipPath id="card_clip_devflow">
      <rect width="800" height="280" rx="0" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <g clip-path="url(#card_clip_devflow)">
    <!-- Card Background -->
    <rect width="800" height="280" fill="url(#card_grad_devflow)" />
    <!-- Outer Border -->
    <rect x="0.5" y="0.5" width="799" height="279" stroke="#1E293B" fill="none" />
    <!-- Top divider line connecting to screenshot -->
    <line x1="0" y1="0.5" x2="800" y2="0.5" stroke="#334155" stroke-width="1" />

    <!-- Icon Box (Square with border, like reference image) -->
    <g transform="translate(32, 22)">
      <rect width="48" height="48" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="24" y="32" text-anchor="middle" font-size="24">🔄</text>
    </g>

    <!-- Project Title -->
    <text x="96" y="44" class="font-sans" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      DEVFLOW — SYSTEM ARCHITECTURE
    </text>

    <!-- Tech Stack (in accent color like reference image) -->
    <text x="96" y="64" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.2">
      Next.js 14 • React Flow • TypeScript • Python State • Tailwind
    </text>

    <!-- Description Paragraph -->
    <g transform="translate(32, 105)">
      <text class="font-sans" font-size="14.5" fill="#94A3B8" font-weight="400">
        <tspan x="0" y="0">Visual node-based architectural mapping canvas enabling developers to conne</tspan>
        <tspan x="0" y="24">ct features, APIs, data schemas, and state pipelines before coding.</tspan>
      </text>
    </g>

    <!-- Category Pill Tags -->
    
        <g transform="translate(32, 190)">
          <rect width="160.5" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="80.25" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">SYSTEM ARCHITECTURE</text>
        </g>
        <g transform="translate(202.5, 190)">
          <rect width="100.5" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="50.25" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">NODE CANVAS</text>
        </g>
        <g transform="translate(313.0, 190)">
          <rect width="138.0" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="69.0" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">WORKFLOW PLANNER</text>
        </g>

    <!-- Action Link: VIEW REPOSITORY ➔ -->
    <g transform="translate(32, 246)">
      <text class="font-sans" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1">
        VIEW REPOSITORY &#10142;
      </text>
    </g>
  </g>
</svg>